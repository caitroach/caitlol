:root { --bg: #F6F6F6; --ink: #0A0A0A; }
@media (prefers-color-scheme: dark) { :root { --bg: #0A0A0A; --ink: #F5F5F5; } }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; font-family: ui-monospace, 'Space Mono', Menlo, Consolas, monospace; }
.win { width: min(100%, 560px); border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); background: var(--bg); }
.titlebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 12px; background: repeating-linear-gradient(0deg, var(--ink) 0 2px, var(--bg) 2px 6px); border-bottom: 3px solid var(--ink); font-weight: 700; font-size: 0.76rem; letter-spacing: 0.06em; text-transform: uppercase; }
.titlebar span { background: var(--bg); padding: 2px 10px; }
.gif { display: block; width: 100%; height: auto; background: #0A0A0A; border-bottom: 3px solid var(--ink); }
.body { padding: 24px 22px 28px; text-align: center; }
h1 { margin: 0 0 12px; font-family: 'Cenios', 'Arial', sans-serif; font-weight: 400; font-synthesis: none; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; }
p { margin: 0 0 24px; font-size: 1rem; line-height: 1.5; }
b { font-weight: 700; }
.btn { display: inline-block; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; padding: 13px 20px; border: 3px solid var(--ink); background: var(--ink); color: var(--bg); box-shadow: 4px 4px 0 var(--ink); }
.btn:hover, .btn:focus-visible { background: var(--bg); color: var(--ink); transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn:active { transform: translate(4px, 4px); box-shadow: none; }
</style>
